<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cable Calculator</title>
    </head>
    <body>
        <h1>Cable Calculator</h1>


        <!-- Supplier price currency. This governs everything below it: a cedi
             price needs no exchange rate, so nothing is fetched and nothing
             can go stale. GHS is listed first, so it is the default and the
             page opens without touching the network. -->
        <label>Supplier price currency
            <select id="price-currency">
                <option value="GHS">GHS — Ghana cedis</option>
                <option value="USD">USD — US dollars</option>
            </select>
        </label>

        <!-- Exchange rate banner. Shows the locked rate, when it was locked,
             and whether the rate service could be reached at all. The person
             must always be able to see which rate they are quoting on. -->
        <p id="rate-status">Fetching today's rate…</p>

        <!-- type="button" is deliberate: without it a button defaults to
             submitting a form, which is not what refreshing a rate means. -->
        <button type="button" id="refresh-rate">Refresh rate</button>


        <!-- FX allowance. The fetched rate is mid-market — not what a bank
             charges to sell you dollars. Opens at 0 so no margin is ever
             applied without the user choosing it. -->
        <label>FX allowance (%)
            <input type="text" id="fx-allowance" value="0">
        </label>
        <p><small>The rate shown is a public mid-market rate. Confirm the
        margin with your bank before you commit to a rate.</small></p>
        <!-- Input form. Everything the calculator needs for one cable run.
             "id" on each control is the label JavaScript uses to find it.
             This must sit ABOVE the <script> tag: the script runs the moment
             the browser reaches it, and can only find elements already read. -->
        <form id="run-form">

            <!-- type="text", not type="number", on purpose: type="number"
                 would silently block bad input, and we want our own validation
                 to catch it so the rules live in one place we control. -->
            <label>Length (m) <input type="text" id="length"></label>
            <label>Current (A) <input type="text" id="current"></label>

            
            <!-- Protective device rating In. Leave EMPTY and the tool picks
                 the next standard BS EN 60898 rating at or above Ib. Fill it
                 in when that assumption does not hold — a BS 3036 rewireable
                 fuse, or a motor circuit sized on starting current. -->
            <label>Device rating (A, optional) <input type="text" id="device-rating"></label>

            <label>CSA (mm²) <input type="text" id="csa"></label>

            <!-- Conductor metal. The value="..." strings are exactly the keys of
                 CONDUCTORS in script.js, so getConductor() can read them as-is. -->
            <label>Conductor
                <select id="material">
                    <option value="copper">Copper</option>
                    <option value="aluminium">Aluminium</option>
                </select>
            </label>
            <!-- The value="..." strings are exactly what getPhaseFactor()
                 accepts, so nothing has to be translated in between. -->
            <label>Supply
                <select id="supply">
                    <option value="single">Single phase 230 V</option>
                    <option value="three">Three phase 415 V</option>
                </select>
            </label>

            <!-- Same again for getDropLimit(): "power" or "lighting". -->
            <label>Circuit
                <select id="circuit">
                    <option value="power">Power — 5%</option>
                    <option value="lighting">Lighting — 3%</option>
                </select>
            </label>

            <!-- Earth fault loop. Four inputs, because Zs needs the supply
                 (Ze and the earthing arrangement), the circuit (the CPC and
                 its metal) and the device (which curve it follows). -->
            <label>Earthing arrangement
                <select id="earthing">
                    <option value="TN_C_S">TN-C-S (PME)</option>
                    <option value="TN_S">TN-S</option>
                    <option value="TT">TT (not checked — needs RCD rule)</option>
                </select>
            </label>

            <label>Ze (Ω, optional — measured at the origin)
                <input type="text" id="ze"></label>

            <label>Device curve
                <select id="mcb-curve">
                    <option value="B">Type B — Ia 5 x In</option>
                    <option value="C">Type C — Ia 10 x In</option>
                    <option value="D">Type D — Ia 20 x In</option>
                </select>
            </label>

            <label>CPC size (mm²) <input type="text" id="cpc" value="2.5"></label>

            <label>CPC metal
                <select id="cpc-material">
                    <option value="copper">Copper</option>
                    <option value="aluminium">Aluminium</option>
                </select>
            </label>

            <!-- Installation conditions. The capacity table above holds ONE
                 set of conditions: 30 °C ambient, one circuit, no insulation,
                 an MCB. These four selects say how far this run differs from
                 that. Every one of them can only make the cable carry LESS,
                 never more — which is why leaving them alone is the safe
                 default and changing them always costs you capacity.

                 SELECTS, not text boxes, on purpose. BS 7671 tabulates these
                 factors at fixed points only. A text box invites someone to
                 type 38 °C, and the tool would then have to choose between
                 the 35 row and the 40 row. This tool does not guess. -->

            <!-- The arrangement. FIRST in this group because it decides more
                 than anything else here: it picks the capacity column AND the
                 grouping table. The value strings are the keys of
                 INSTALLATION_ARRANGEMENTS, exactly.
                 C is selected by default — the tool's original assumption, so
                 nobody's existing habit changes. -->
            <label>Installation arrangement
                <select id="installation">
                    <option value="A">A — in conduit in an insulating wall</option>
                    <option value="B">B — in conduit on a wall, or in trunking</option>
                    <option value="C" selected>C — clipped direct</option>
                    <option value="E_touching">E — perforated tray, touching</option>
                    <option value="E_spaced_h">E — perforated tray, spaced, horizontal</option>
                    <option value="E_spaced_v">E — perforated tray, spaced, vertical</option>
                </select>
            </label>

            <!-- Ca. These values are the keys of FACTOR_CA_PVC, exactly.
                 30 °C is the base the capacity table was measured at. -->
            <label>Ambient temperature (°C)
                <select id="ambient">
                    <option value="25">25</option>
                    <option value="30" selected>30 — table base</option>
                    <option value="35">35</option>
                    <option value="40">40</option>
                    <option value="45">45</option>
                    <option value="50">50</option>
                    <option value="55">55</option>
                    <option value="60">60</option>
                </select>
            </label>

            <!-- Cg. Count every circuit in the group INCLUDING this one.
                 One circuit is not a group, so the factor is 1.00. -->
            <label>Circuits in group
                <select id="circuits-in-group">
                    <option value="1" selected>1 — not grouped</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                </select>
            </label>

            <!-- Ci. Route length surrounded by thermal insulation, in mm.
                 Table 52.2 stops at 400 mm. A run buried deeper than that is
                 NOT covered by this list — there is a separate rule in Reg
                 523.9 for a cable totally surrounded, and this tool does not
                 hold it yet. -->
            <label>In thermal insulation (mm)
                <select id="insulation-mm">
                    <option value="0" selected>0 — none</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                    <option value="400">400</option>
                </select>
            </label>

            <!-- Cf. These values are the keys of FACTOR_CF, exactly.
                 Choosing BS 3036 means the Device rating box above must be
                 filled in by hand: this tool holds the BS EN 60898 ladder
                 only, and the BS 3036 ratings are a different list. -->
            <label>Protective device
                <select id="device-type">
                    <option value="standard" selected>MCB / RCBO / BS 88 fuse</option>
                    <option value="bs3036">BS 3036 rewireable fuse</option>
                </select>
            </label>

            <!-- Supplier price per metre, in whichever currency is selected
                 at the top of the page. OPTIONAL — leave it empty for a volt
                 drop check with no pricing. -->
            <label>Price per metre <input type="text" id="price"></label>
            <!-- type="submit" makes this button fire the form's submit event. -->
            <button type="submit">Calculate</button>
            <button type="reset">Clear</button>
        </form>
        <!-- Where input problems are shown. Empty until something is wrong. -->
        <p id="error"></p>


        <!-- Sizing sanity note. Says how much of the volt drop allowance the
             run uses, and how small volt drop alone would permit — so an
             over-specified cable is visible instead of silently passing. -->
        <p id="sizing-note"></p>

        <!-- Results table. The tbody is empty until JavaScript fills it. -->
        <table>
            <thead>
                <tr><th>Case</th><th>Volts dropped</th><th>% drop</th><th>Verdict</th><th>Cost</th></tr>
            </thead>
            <tbody id="results"></tbody>
        </table>

        <!-- Last thing in the body, so every element above already exists. -->
        <script src="script.js"></script>
    </body>
</html>
